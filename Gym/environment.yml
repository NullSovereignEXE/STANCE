name: stance
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.22
  - pip
  - pip:  # mirrors Network_Agent/requirements.txt
      - --extra-index-url https://download.pytorch.org/whl/cpu  # CPU-only torch, skips CUDA downloads
      - stable-baselines3==2.9.0
      - sb3-contrib==2.9.0
      - torch==2.14.1
      - gymnasium==1.4.0
      - numpy==2.2.6
      - mujoco==3.15.0
      - moviepy==2.2.1
      - matplotlib==3.10.9
      - pytest==9.1.1
